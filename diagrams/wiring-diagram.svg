<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <!-- Background -->
  <rect width="1200" height="800" fill="#f5f5f5"/>
  
  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#333">ESP Prayer System - Wiring Diagram</text>
  <text x="600" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#666">ESP8266 NodeMCU + DFPlayer Mini + LCD 1602 I2C</text>

  <!-- ESP8266 NodeMCU -->
  <rect x="80" y="150" width="200" height="400" rx="10" fill="#4a90a4" stroke="#333" stroke-width="2"/>
  <text x="180" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">ESP8266</text>
  <text x="180" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">NodeMCU</text>
  
  <!-- ESP Pins Left -->
  <text x="90" y="250" font-family="Arial, sans-serif" font-size="12" fill="white">3V3</text>
  <text x="90" y="290" font-family="Arial, sans-serif" font-size="12" fill="white">D1</text>
  <text x="90" y="330" font-family="Arial, sans-serif" font-size="12" fill="white">D2</text>
  <text x="90" y="370" font-family="Arial, sans-serif" font-size="12" fill="white">D3</text>
  <text x="90" y="410" font-family="Arial, sans-serif" font-size="12" fill="white">D4</text>
  <text x="90" y="450" font-family="Arial, sans-serif" font-size="12" fill="white">D5</text>
  <text x="90" y="490" font-family="Arial, sans-serif" font-size="12" fill="white">D6</text>
  <text x="90" y="530" font-family="Arial, sans-serif" font-size="12" fill="white">D7</text>
  <text x="90" y="570" font-family="Arial, sans-serif" font-size="12" fill="white">D8</text>
  
  <!-- ESP Pins Right -->
  <text x="260" y="250" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="white">GND</text>
  <text x="260" y="500" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="white">VIN (5V)</text>

  <!-- DFPlayer Mini -->
  <rect x="450" y="150" width="180" height="200" rx="8" fill="#2196F3" stroke="#333" stroke-width="2"/>
  <text x="540" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">DFPlayer Mini</text>
  <text x="540" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">MP3 Module</text>
  
  <!-- DFPlayer Pins -->
  <text x="460" y="240" font-family="Arial, sans-serif" font-size="11" fill="white">VCC</text>
  <text x="460" y="265" font-family="Arial, sans-serif" font-size="11" fill="white">RX</text>
  <text x="460" y="290" font-family="Arial, sans-serif" font-size="11" fill="white">TX</text>
  <text x="460" y="315" font-family="Arial, sans-serif" font-size="11" fill="white">GND</text>
  <text x="460" y="340" font-family="Arial, sans-serif" font-size="11" fill="white">SPK1</text>
  <text x="590" y="340" font-family="Arial, sans-serif" font-size="11" fill="white">SPK2</text>

  <!-- LCD 1602 I2C -->
  <rect x="450" y="400" width="180" height="150" rx="8" fill="#4CAF50" stroke="#333" stroke-width="2"/>
  <text x="540" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">LCD 1602</text>
  <text x="540" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">I2C Module</text>
  
  <!-- LCD Pins -->
  <text x="460" y="490" font-family="Arial, sans-serif" font-size="11" fill="white">VCC</text>
  <text x="460" y="510" font-family="Arial, sans-serif" font-size="11" fill="white">GND</text>
  <text x="460" y="530" font-family="Arial, sans-serif" font-size="11" fill="white">SDA</text>
  <text x="590" y="530" font-family="Arial, sans-serif" font-size="11" fill="white">SCL</text>

  <!-- Rotary Encoder -->
  <rect x="750" y="150" width="160" height="180" rx="8" fill="#FF9800" stroke="#333" stroke-width="2"/>
  <text x="830" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Rotary</text>
  <text x="830" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Encoder</text>
  <text x="830" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">KY-040</text>
  
  <!-- Rotary Pins -->
  <text x="760" y="250" font-family="Arial, sans-serif" font-size="11" fill="white">VCC</text>
  <text x="760" y="270" font-family="Arial, sans-serif" font-size="11" fill="white">GND</text>
  <text x="760" y="290" font-family="Arial, sans-serif" font-size="11" fill="white">CLK</text>
  <text x="760" y="310" font-family="Arial, sans-serif" font-size="11" fill="white">DT</text>
  <text x="860" y="310" font-family="Arial, sans-serif" font-size="11" fill="white">SW</text>

  <!-- Speaker -->
  <ellipse cx="830" cy="420" rx="60" ry="40" fill="#607D8B" stroke="#333" stroke-width="2"/>
  <text x="830" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Speaker</text>
  <text x="830" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">8Ω 1W</text>

  <!-- Stop Button -->
  <rect x="750" y="500" width="100" height="60" rx="5" fill="#f44336" stroke="#333" stroke-width="2"/>
  <text x="800" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">STOP</text>
  <text x="800" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">Button</text>

  <!-- Buzzer -->
  <circle cx="700" cy="500" r="25" fill="#9C27B0" stroke="#333" stroke-width="2"/>
  <text x="700" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">BZ</text>

  <!-- Buck Converter -->
  <rect x="1000" y="300" width="150" height="120" rx="8" fill="#795548" stroke="#333" stroke-width="2"/>
  <text x="1075" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Buck</text>
  <text x="1075" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">Converter</text>
  <text x="1075" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">9V → 5V</text>

  <!-- 9V Battery -->
  <rect x="1020" y="450" width="60" height="100" rx="5" fill="#333" stroke="#333" stroke-width="2"/>
  <rect x="1035" y="440" width="30" height="15" rx="2" fill="#666"/>
  <text x="1050" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4CAF50">9V</text>
  <text x="1050" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="white">Battery</text>

  <!-- Connections - Wires -->
  <!-- ESP to DFPlayer -->
  <line x1="280" y1="450" x2="450" y2="265" stroke="#2196F3" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="280" y1="490" x2="450" y2="290" stroke="#4CAF50" stroke-width="2"/>
  <text x="350" y="350" font-family="Arial, sans-serif" font-size="10" fill="#2196F3">D5→RX (1kΩ)</text>
  <text x="350" y="370" font-family="Arial, sans-serif" font-size="10" fill="#4CAF50">D6→TX</text>

  <!-- ESP to LCD -->
  <line x1="280" y1="290" x2="450" y2="530" stroke="#FFC107" stroke-width="2"/>
  <line x1="280" y1="330" x2="590" y2="530" stroke="#2196F3" stroke-width="2"/>
  <text x="350" y="430" font-family="Arial, sans-serif" font-size="10" fill="#FFC107">D1→SCL</text>
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="10" fill="#2196F3">D2→SDA</text>

  <!-- ESP to Rotary -->
  <line x1="280" y1="530" x2="750" y2="290" stroke="#FF9800" stroke-width="2"/>
  <line x1="280" y1="570" x2="750" y2="310" stroke="#FF9800" stroke-width="2"/>
  <line x1="280" y1="410" x2="860" y2="310" stroke="#FF9800" stroke-width="2"/>
  <text x="500" y="270" font-family="Arial, sans-serif" font-size="10" fill="#FF9800">D7→CLK</text>
  <text x="500" y="290" font-family="Arial, sans-serif" font-size="10" fill="#FF9800">D8→DT</text>
  <text x="600" y="370" font-family="Arial, sans-serif" font-size="10" fill="#FF9800">D4→SW</text>

  <!-- ESP to Buzzer -->
  <line x1="280" y1="370" x2="675" y2="500" stroke="#9C27B0" stroke-width="2"/>
  <text x="450" y="440" font-family="Arial, sans-serif" font-size="10" fill="#9C27B0">D3→BZ+</text>

  <!-- ESP to Stop Button -->
  <line x1="280" y1="330" x2="750" y2="530" stroke="#f44336" stroke-width="2"/>
  <text x="500" y="440" font-family="Arial, sans-serif" font-size="10" fill="#f44336">D2→STOP</text>

  <!-- DFPlayer to Speaker -->
  <line x1="630" y1="340" x2="770" y2="400" stroke="#607D8B" stroke-width="3"/>
  <line x1="630" y1="340" x2="830" y2="400" stroke="#607D8B" stroke-width="3"/>
  <text x="700" y="380" font-family="Arial, sans-serif" font-size="10" fill="#607D8B">SPK1, SPK2</text>

  <!-- Power Connections -->
  <line x1="1050" y1="450" x2="1075" y2="420" stroke="#f44336" stroke-width="3"/>
  <line x1="1075" y1="300" x2="280" y2="500" stroke="#f44336" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="900" y="380" font-family="Arial, sans-serif" font-size="10" fill="#f44336">5V → VIN</text>

  <!-- GND Connections -->
  <line x1="280" y1="250" x2="450" y2="315" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="250" x2="450" y2="510" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="250" x2="750" y2="270" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="250" x2="800" y2="560" stroke="#333" stroke-width="2"/>
  <line x1="280" y1="250" x2="700" y2="525" stroke="#333" stroke-width="2"/>
  <text x="350" y="230" font-family="Arial, sans-serif" font-size="10" fill="#333">Common GND</text>

  <!-- 3.3V Connections -->
  <line x1="280" y1="250" x2="450" y2="490" stroke="#f44336" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="280" y1="250" x2="750" y2="250" stroke="#f44336" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="350" y="260" font-family="Arial, sans-serif" font-size="10" fill="#f44336">3.3V</text>

  <!-- Legend -->
  <rect x="80" y="620" width="1040" height="160" rx="10" fill="white" stroke="#ccc" stroke-width="1"/>
  <text x="600" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Wire Color Legend</text>
  
  <line x1="100" y1="680" x2="150" y2="680" stroke="#2196F3" stroke-width="3"/>
  <text x="160" y="685" font-family="Arial, sans-serif" font-size="12" fill="#333">Blue - I2C SDA / Data</text>
  
  <line x1="100" y1="710" x2="150" y2="710" stroke="#FFC107" stroke-width="3"/>
  <text x="160" y="715" font-family="Arial, sans-serif" font-size="12" fill="#333">Yellow - I2C SCL</text>
  
  <line x1="100" y1="740" x2="150" y2="740" stroke="#4CAF50" stroke-width="3"/>
  <text x="160" y="745" font-family="Arial, sans-serif" font-size="12" fill="#333">Green - Serial TX/RX</text>
  
  <line x1="400" y1="680" x2="450" y2="680" stroke="#FF9800" stroke-width="3"/>
  <text x="460" y="685" font-family="Arial, sans-serif" font-size="12" fill="#333">Orange - Rotary Encoder</text>
  
  <line x1="400" y1="710" x2="450" y2="710" stroke="#9C27B0" stroke-width="3"/>
  <text x="460" y="715" font-family="Arial, sans-serif" font-size="12" fill="#333">Purple - Buzzer</text>
  
  <line x1="400" y1="740" x2="450" y2="740" stroke="#f44336" stroke-width="3"/>
  <text x="460" y="745" font-family="Arial, sans-serif" font-size="12" fill="#333">Red - Power (5V/3.3V)</text>
  
  <line x1="700" y1="680" x2="750" y2="680" stroke="#333" stroke-width="3"/>
  <text x="760" y="685" font-family="Arial, sans-serif" font-size="12" fill="#333">Black - Ground (GND)</text>
  
  <line x1="700" y1="710" x2="750" y2="710" stroke="#607D8B" stroke-width="3"/>
  <text x="760" y="715" font-family="Arial, sans-serif" font-size="12" fill="#333">Gray - Speaker</text>
  
  <line x1="700" y1="740" x2="750" y2="740" stroke="#f44336" stroke-width="3" stroke-dasharray="8,4"/>
  <text x="760" y="745" font-family="Arial, sans-serif" font-size="12" fill="#333">Dashed - Optional</text>

  <!-- Footer -->
  <text x="600" y="795" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#999">ESP Prayer System v1.0 | Generated for documentation</text>
</svg>