<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
إعدادات الصوت
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">



<header class="header">

<h1>
🔊 إعدادات الصوت
</h1>

<span id="status">
جاري التحميل...
</span>

</header>





<section class="card">


<h2>
DFPlayer
</h2>


<label>
تفعيل الأذان
</label>

<select id="azanEnable">

<option value="true">
تشغيل
</option>

<option value="false">
إيقاف
</option>

</select>


<label>
مستوى الصوت
</label>



<input
type="range"
id="volume"
min="0"
max="30"
value="25"
oninput="showVolume(this.value)"
>



<p>
الصوت:
<span id="volumeValue">
25
</span>
</p>



</section>







<section class="card">


<h2>
ملفات الصوت
</h2>




<label>
مجلد الأذان
</label>


<input

type="number"

id="azanFolder"

min="1"

max="99"

>




<label>
رقم ملف الأذان
</label>


<input

type="number"

id="azanFile"

min="1"

max="999"

>



</section>









<section class="card">


<h2>
اختبار الصوت
</h2>



<button onclick="testAzan()">

▶ تشغيل أذان تجريبي

</button>



<button onclick="testSound()">

🎵 تشغيل ملف اختبار

</button>



</section>









<section class="card">


<button onclick="saveAudioSettings()">

💾 حفظ الإعدادات

</button>




<button onclick="location.href='/'">

⬅ العودة

</button>



</section>





</div>







<script src="script.js"></script>



<script>



/*
==============================
تحميل الإعدادات من ESP
==============================
*/


window.onload = function()
{


fetch("/api/settings/audio")


.then(response => response.json())


.then(data =>
{


document.getElementById("volume")
.value = data.volume;

document.getElementById("azanEnable")
.value = data.azanEnable;


document.getElementById("volumeValue")
.innerHTML = data.volume;



document.getElementById("azanFolder")
.value = data.azanFolder;



document.getElementById("azanFile")
.value = data.azanFile;



document.getElementById("status")
.innerHTML =
"متصل";



})



.catch(error =>
{


document.getElementById("status")
.innerHTML =
"خطأ اتصال";


});



};







/*
==============================
عرض مستوى الصوت
==============================
*/


function showVolume(value)
{


document.getElementById("volumeValue")
.innerHTML=value;


}









/*
==============================
اختبار الأذان
==============================
*/


function testAzan()
{


fetch("/api/test/azan",
{

method:"POST"

})


.then(() =>
{

alert("تم تشغيل الأذان");

});


}









/*
==============================
اختبار ملف صوت
==============================
*/


function testSound()
{


fetch("/api/test/audio",
{

method:"POST"

})


.then(() =>
{

alert("تم تشغيل الملف");

});


}









/*
==============================
حفظ الإعدادات
==============================
*/


function saveAudioSettings()
{


let data =
{

volume:
Number(
document.getElementById("volume").value
),


azanEnable:
document.getElementById("azanEnable").value === "true",


azanFolder:
Number(
document.getElementById("azanFolder").value
),


azanFile:
Number(
document.getElementById("azanFile").value
)

};




fetch("/api/settings/audio",
{


method:"POST",


headers:
{

"Content-Type":"application/json"

},



body:
JSON.stringify(data)



})



.then(response => response.text())


.then(() =>
{


alert(
"تم حفظ إعدادات الصوت"
);



});



}



</script>




</body>

</html>
