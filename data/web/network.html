<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات الشبكة</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <header class="header">
            <h1>📡 إعدادات الشبكة</h1>
        </header>

        <section class="card">
            <h2>WiFi</h2>
            <label>اسم الشبكة SSID</label>
            <input type="text" id="wifiSSID" placeholder="WiFi Name">

            <label>كلمة المرور</label>
            <input type="password" id="wifiPassword" placeholder="اتركها فارغة إذا لم تترغب بتغييرها">
        </section>

        <section class="card">
            <h2>MQTT</h2>

            <label>Server</label>
            <input type="text" id="mqttServer" placeholder="192.168.0.100">

            <label>Port</label>
            <input type="number" id="mqttPort" value="1883">

            <label>Username</label>
            <input type="text" id="mqttUser">

            <label>Password</label>
            <input type="password" id="mqttPassword" placeholder="Password">
        </section>

        <section class="card">
            <h2>حالة الاتصال</h2>
            <p>📶 WiFi: <span id="wifiStatus">غير معروف</span></p>
            <p>📡 MQTT: <span id="mqttStatus">غير معروف</span></p>
        </section>

        <section class="card">
            <button id="saveBtn" onclick="saveNetworkSettings()">💾 حفظ الإعدادات</button>
            <button onclick="location.href='index.html'">⬅ العودة</button>
        </section>


    </div>

    <script src="script.js"></script>

    <script>
        // =====================================
        // Load Network Settings
        // =====================================
        function loadNetworkSettings() {
            fetch("/api/settings/network")
                .then(response => response.json())
                .then(data => {
                    document.getElementById("wifiSSID").value = data.wifiSSID || "";
                    document.getElementById("mqttServer").value = data.mqttServer || "";
                    document.getElementById("mqttPort").value = data.mqttPort || 1883;
                    document.getElementById("mqttUser").value = data.mqttUser || "";
                    
                    // تحديث حالات الاتصال إن وجدت في الـ JSON
                    if(data.wifiConnected !== undefined) {
                        document.getElementById("wifiStatus").innerText = data.wifiConnected ? "متصل 🟢" : "غير متصل 🔴";
                    }
                    if(data.mqttConnected !== undefined) {
                        document.getElementById("mqttStatus").innerText = data.mqttConnected ? "متصل 🟢" : "غير متصل 🔴";
                    }
                })
                .catch(error => {
                    console.log("Load Network Error:", error);
                });
        }

        // =====================================
        // Save Network Settings
        // =====================================
        function saveNetworkSettings() {
            let wifiSSID = document.getElementById("wifiSSID").value.trim();
            
            if (wifiSSID === "") {
                alert("أدخل اسم الشبكة SSID أولاً");
                return;
            }

            let saveBtn = document.getElementById("saveBtn");
            saveBtn.disabled = true;
            saveBtn.innerText = "جاري الحفظ...";

            let data = {
                wifiSSID: wifiSSID,
                wifiPassword: document.getElementById("wifiPassword").value,
                wifiEnable: true,
                mqttServer: document.getElementById("mqttServer").value.trim(),
                mqttPort: Number(document.getElementById("mqttPort").value),
                mqttUser: document.getElementById("mqttUser").value.trim(),
                mqttPassword: document.getElementById("mqttPassword").value
            };

            fetch("/api/settings/network", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                console.log("Saved:", result);
                alert("تم حفظ إعدادات الشبكة بنجاح! سيتم إعادة تشغيل الجهاز لتطبيق الإعدادات.");
                saveBtn.innerText = "💾 حفظ الإعدادات";
                saveBtn.disabled = false;
            })
            .catch(error => {
                console.log("Save Error:", error);
                alert("فشل حفظ الإعدادات، يرجى التأكد من الاتصال للجهاز.");
                saveBtn.innerText = "💾 حفظ الإعدادات";
                saveBtn.disabled = false;
            });
        }

        // تشغيل عند فتح الصفحة
        loadNetworkSettings();
    </script>

</body>
</html>
