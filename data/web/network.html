<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
إعدادات الشبكة
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<header class="header">

<h1>
📡 إعدادات الشبكة
</h1>

</header>




<section class="card">


<h2>
WiFi
</h2>



<label>
اسم الشبكة SSID
</label>


<input
type="text"
id="wifiSSID"
placeholder="WiFi Name"
>




<label>
كلمة المرور
</label>


<input
type="password"
id="wifiPassword"
placeholder="Password"
>



</section>






<section class="card">


<h2>
MQTT
</h2>




<label>
Server
</label>


<input
type="text"
id="mqttServer"
placeholder="192.168.1.10"
>



<label>
Port
</label>


<input
type="number"
id="mqttPort"
value="1883"
>




<label>
Username
</label>


<input
type="text"
id="mqttUser"
>



<label>
Password
</label>


<input
type="password"
id="mqttPassword"
>



</section>







<section class="card">


<h2>
حالة الاتصال
</h2>



<p>

📶 WiFi:

<span id="wifiStatus">

غير معروف

</span>

</p>



<p>

📡 MQTT:

<span id="mqttStatus">

غير معروف

</span>

</p>



</section>







<section class="card">


<button onclick="saveNetworkSettings()">

💾 حفظ الإعدادات

</button>



<button onclick="location.href='index.html'">

⬅ العودة

</button>


</section>





</div>





<script src="script.js"></script>



<script>


function saveNetworkSettings()
{


let data =
{

wifiSSID:
document.getElementById("wifiSSID").value,


wifiPassword:
document.getElementById("wifiPassword").value,


mqttServer:
document.getElementById("mqttServer").value,


mqttPort:
document.getElementById("mqttPort").value,


mqttUser:
document.getElementById("mqttUser").value,


mqttPassword:
document.getElementById("mqttPassword").value


};




fetch("/api/settings/network",
{

method:"POST",


headers:
{
"Content-Type":"application/json"
},


body:
JSON.stringify(data)


});



alert("تم حفظ إعدادات الشبكة");


}



</script>


</body>

</html>
