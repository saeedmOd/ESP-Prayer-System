```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
إعدادات الصلاة
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<header class="header">

<h1>
🕌 إعدادات الصلاة
</h1>

</header>





<section class="card">


<h2>
📍 الموقع
</h2>



<label>
المدينة
</label>

<input 
type="text"
id="city"
>


<label>
الدولة
</label>

<input 
type="text"
id="country"
>


<label>
خط العرض
</label>

<input 
type="number"
id="latitude"
step="0.0001"
>


<label>
خط الطول
</label>

<input 
type="number"
id="longitude"
step="0.0001"
>


</section>






<section class="card">


<h2>
🧮 طريقة الحساب
</h2>


<select id="method">


<option value="UmmAlQura">
جامعة أم القرى
</option>


<option value="MWL">
رابطة العالم الإسلامي
</option>


<option value="Egyptian">
الهيئة المصرية
</option>


<option value="Karachi">
كراتشي
</option>


</select>


</section>







<section class="card">


<h2>
🕒 نظام الوقت
</h2>


<label>
صيغة الساعة
</label>


<select id="timeFormat">


<option value="24H">
24 ساعة
</option>


<option value="12H">
12 ساعة
</option>


</select>


</section>








<section class="card">


<h2>
⏱ تعديل مواقيت الصلاة
</h2>



<label>
الفجر
</label>

<input 
type="number"
id="fajr_offset"
value="0"
>




<label>
الظهر
</label>

<input 
type="number"
id="dhuhr_offset"
value="0"
>




<label>
العصر
</label>

<input 
type="number"
id="asr_offset"
value="0"
>




<label>
المغرب
</label>

<input 
type="number"
id="maghrib_offset"
value="0"
>




<label>
العشاء
</label>

<input 
type="number"
id="isha_offset"
value="0"
>



</section>







<section class="card">


<button onclick="savePrayerSettings()">

💾 حفظ الإعدادات

</button>



<button onclick="location.href='/'">

⬅ العودة

</button>


</section>



</div>






<script>


// ================================
// Load Settings
// ================================

function loadPrayerSettings()
{

fetch("/api/settings/prayer")


.then(response => response.json())


.then(data =>
{


console.log(
"Loaded Prayer Settings:",
data
);



document.getElementById("city").value =
data.city || "";


document.getElementById("country").value =
data.country || "";


document.getElementById("latitude").value =
data.latitude || "";


document.getElementById("longitude").value =
data.longitude || "";


document.getElementById("method").value =
data.method || data.calculation_method || "UmmAlQura";


document.getElementById("timeFormat").value =
data.time_format || data.timeFormat || "24H";



document.getElementById("fajr_offset").value =
data.fajr_offset ?? 0;


document.getElementById("dhuhr_offset").value =
data.dhuhr_offset ?? 0;


document.getElementById("asr_offset").value =
data.asr_offset ?? 0;


document.getElementById("maghrib_offset").value =
data.maghrib_offset ?? 0;


document.getElementById("isha_offset").value =
data.isha_offset ?? 0;



})


.catch(error =>
{

console.log(
"Load Error",
error
);

});


}






// ================================
// Save Settings
// ================================

function savePrayerSettings()
{


let data =
{


city:
document.getElementById("city").value,


country:
document.getElementById("country").value,


latitude:
parseFloat(
document.getElementById("latitude").value
),


longitude:
parseFloat(
document.getElementById("longitude").value
),


method:
document.getElementById("method").value,


time_format:
document.getElementById("timeFormat").value,



fajr_offset:
parseInt(
document.getElementById("fajr_offset").value
),


dhuhr_offset:
parseInt(
document.getElementById("dhuhr_offset").value
),


asr_offset:
parseInt(
document.getElementById("asr_offset").value
),


maghrib_offset:
parseInt(
document.getElementById("maghrib_offset").value
),


isha_offset:
parseInt(
document.getElementById("isha_offset").value
)


};




console.log(
"Sending:",
data
);




fetch("/api/settings/prayer",
{

method:"POST",

headers:
{
"Content-Type":
"application/json"
},


body:
JSON.stringify(data)


})


.then(response =>
{


if(response.ok)
{

alert(
"✅ تم حفظ إعدادات الصلاة"
);


}

else
{

alert(
"❌ فشل الحفظ"
);

}


})


.catch(error =>
{

console.log(error);


alert(
"خطأ في الاتصال"
);


});


}





window.onload =
loadPrayerSettings;


</script>


</body>

</html>
```
