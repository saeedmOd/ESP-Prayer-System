```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
إعدادات الصلاة
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<header class="header">

<h1>
🕌 إعدادات الصلاة
</h1>

</header>





<section class="card">


<h2>
📍 الموقع
</h2>



<label>
المدينة
</label>

<input 
type="text"
id="city"
>


<label>
الدولة
</label>

<input 
type="text"
id="country"
>


<label>
خط العرض
</label>

<input 
type="number"
id="latitude"
step="0.0001"
>


<label>
خط الطول
</label>

<input 
type="number"
id="longitude"
step="0.0001"
>


</section>






<section class="card">


<h2>
🧮 طريقة الحساب
</h2>


<select id="method">


<option value="UmmAlQura">
جامعة أم القرى
</option>


<option value="MWL">
رابطة العالم الإسلامي
</option>


<option value="Egyptian">
الهيئة المصرية
</option>


<option value="Karachi">
كراتشي
</option>


</select>


</section>







<section class="card">


<h2>
🕒 نظام الوقت
</h2>


<label>
صيغة الساعة
</label>


<select id="time_format">


<option value="24H">
24 ساعة
</option>


<option value="12H">
12 ساعة
</option>


</select>


</section>








<section class="card">


<h2>
⏱ تعديل مواقيت الصلاة
</h2>



<label>
الفجر
</label>

<input 
type="number"
id="fajr_offset"
value="0"
>




<label>
الظهر
</label>

<input 
type="number"
id="dhuhr_offset"
value="0"
>




<label>
العصر
</label>

<input 
type="number"
id="asr_offset"
value="0"
>




<label>
المغرب
</label>

<input 
type="number"
id="maghrib_offset"
value="0"
>




<label>
العشاء
</label>

<input 
type="number"
id="isha_offset"
value="0"
>



</section>







<section class="card">


<button onclick="savePrayerSettings()">

💾 حفظ الإعدادات

</button>



<button onclick="location.href='/'">

⬅ العودة

</button>


</section>



</div>






<script>


// ================================
// Load Settings
// ================================


function loadPrayerSettings()
{


fetch("/api/settings/prayer")


.then(response => response.json())


.then(data =>
{


console.log(data);



if(data.city)
city.value=data.city;



if(data.country)
country.value=data.country;



if(data.latitude)
latitude.value=data.latitude;



if(data.longitude)
longitude.value=data.longitude;



if(data.method)
method.value=data.method;



if(data.time_format)
time_format.value=data.time_format;



if(data.fajr_offset)
fajr_offset.value=data.fajr_offset;



if(data.dhuhr_offset)
dhuhr_offset.value=data.dhuhr_offset;



if(data.asr_offset)
asr_offset.value=data.asr_offset;



if(data.maghrib_offset)
maghrib_offset.value=data.maghrib_offset;



if(data.isha_offset)
isha_offset.value=data.isha_offset;



})

.catch(error =>
{

console.log(
"Load Error",
error
);

});


}









// ================================
// Save Settings
// ================================


function savePrayerSettings()
{


let data =
{


city:
city.value,


country:
country.value,


latitude:
parseFloat(latitude.value),


longitude:
parseFloat(longitude.value),


method:
method.value,


time_format:
time_format.value,


fajr_offset:
parseInt(fajr_offset.value),


dhuhr_offset:
parseInt(dhuhr_offset.value),


asr_offset:
parseInt(asr_offset.value),


maghrib_offset:
parseInt(maghrib_offset.value),


isha_offset:
parseInt(isha_offset.value)


};




fetch("/api/settings/prayer",
{


method:"POST",


headers:
{

"Content-Type":
"application/json"

},


body:
JSON.stringify(data)


})


.then(response =>
{


if(response.ok)
{

alert(
"✅ تم حفظ إعدادات الصلاة"
);


}

else
{

alert(
"❌ فشل الحفظ"
);


}


})

.catch(error =>
{


alert(
"خطأ في الاتصال"
);


console.log(error);


});


}






window.onload =
loadPrayerSettings;


</script>


</body>

</html>
```
